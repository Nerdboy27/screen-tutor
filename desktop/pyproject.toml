[project]
name = "screen-tutor-desktop"
version = "1.0.0"
description = "Borderless, hotkey-driven desktop client for the Screen-Aware AI Tutor"
requires-python = ">=3.10"
dependencies = [
    "mss>=9.0.1",
    "pillow>=10.3.0",
    "pynput>=1.7.7",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "ruff>=0.5.0", "mypy>=1.10.0"]

[project.scripts]
screen-tutor = "tutor_desktop.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tutor_desktop*"]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
